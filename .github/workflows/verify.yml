name: Verify source and evidence

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.lane }} evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [rust, kani, verus]
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned Kani
        if: matrix.lane == 'kani'
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Install pinned Verus
        if: matrix.lane == 'verus'
        run: bash tools/install_verus.sh
      - name: Run checks and collect evidence
        run: python3 tools/verify.py --lane ${{ matrix.lane }}
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candle-${{ matrix.lane }}-${{ github.sha }}
          path: |
            evidence/${{ matrix.lane }}/
            evidence/qualification/${{ matrix.lane }}/
          if-no-files-found: warn
